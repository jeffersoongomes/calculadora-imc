<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC - Academia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        h1 {
            color: #1e3a8a;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }
        p {
            color: #4b5563;
            font-size: 0.95rem;
        }
        .instrucao {
            font-size: 0.85rem;
            color: #6b7280;
            background: #eff6ff;
            padding: 8px;
            border-radius: 6px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Calculadora de IMC</h1>
        <p>Acesse o <strong>Console do Navegador (F12)</strong> para conferir a execução do cálculo em JavaScript!</p>
        <div class="instrucao">
            Projeto da aula de Variáveis, Operadores e Decisão.
        </div>
    </div>

    <!-- Script de cálculo -->
    <script src="script.js"></script>
</body>
</html>
